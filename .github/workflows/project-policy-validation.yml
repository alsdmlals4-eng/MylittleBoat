name: Project policy validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  project-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - name: Check project owner routes and Blueprint contract
        run: python3 -B -m unittest discover -s tests -p 'test_*.py' -v
      - name: Reject unresolved merge markers
        shell: bash
        run: |
          if git grep -n -E '^(<<<<<<< |=======$|>>>>>>> )' -- '*.md' '*.gd' '*.tscn' '*.json'; then
            exit 1
          else
            code=$?
            test "$code" -eq 1
          fi
