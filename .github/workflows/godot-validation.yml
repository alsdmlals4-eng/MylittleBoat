name: Godot 4.7 validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Godot 4.7
        uses: chickensoft-games/setup-godot@v2.4.1
        with:
          version: 4.7.0
          use-dotnet: false
          include-templates: true

      - name: Verify Godot version
        run: godot --version

      - name: Complete Godot import cache hydration
        run: godot --headless --path . --import

      - name: Run current headless behavior contracts
        shell: bash
        run: |
          set -uo pipefail
          EXPECTED_ALL_CONTRACT_COUNT=56
          EXPECTED_HEADLESS_CONTRACT_COUNT=55
          DISPLAY_ONLY_CONTRACT=test_chibi_normal_chroma_material_proof.gd
          mapfile -t all_contracts < <(find tests -maxdepth 1 -type f -name 'test_*.gd' -printf '%f\n' | LC_ALL=C sort)
          total_contract_count=${#all_contracts[@]}
          if [[ "$total_contract_count" -ne "$EXPECTED_ALL_CONTRACT_COUNT" ]]; then
            echo "::error::Expected $EXPECTED_ALL_CONTRACT_COUNT current Godot contracts, found $total_contract_count. Review the CI count and renderer boundary."
            exit 1
          fi

          status=0
          headless_contract_count=0
          display_only_contract_count=0
          for contract in "${all_contracts[@]}"; do
            if [[ "$contract" == "$DISPLAY_ONLY_CONTRACT" ]]; then
              display_only_contract_count=$((display_only_contract_count + 1))
              echo "SKIP: $contract requires a display renderer and is verified separately."
              continue
            fi

            headless_contract_count=$((headless_contract_count + 1))
            echo "::group::Godot contract $contract"
            timeout 20s godot --headless --path . --script "res://tests/$contract" || status=1
            echo "::endgroup::"
          done

          if [[ "$display_only_contract_count" -ne 1 ]]; then
            echo "::error::Expected exactly one display-only contract named $DISPLAY_ONLY_CONTRACT, found $display_only_contract_count."
            status=1
          fi
          if [[ "$headless_contract_count" -ne "$EXPECTED_HEADLESS_CONTRACT_COUNT" ]]; then
            echo "::error::Expected $EXPECTED_HEADLESS_CONTRACT_COUNT headless contracts, ran $headless_contract_count."
            status=1
          fi
          exit "$status"

      - name: Smoke main menu scene
        run: godot --headless --path . --scene "res://scenes/main_menu.tscn" --quit-after 1

      - name: Smoke game scene
        run: godot --headless --path . --scene "res://scenes/game.tscn" --quit-after 1

      - name: Smoke album scene
        run: godot --headless --path . --scene "res://scenes/album.tscn" --quit-after 1

      - name: Export internal Windows package
        shell: bash
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Windows Desktop" build/my_little_boat.exe
          test -f build/my_little_boat.exe
          test -f build/my_little_boat.pck
          sha256sum build/my_little_boat.exe build/my_little_boat.pck > build/SHA256SUMS.txt
          zip -j build/my-little-boat-windows-internal.zip build/my_little_boat.exe build/my_little_boat.pck build/SHA256SUMS.txt
          unzip -l build/my-little-boat-windows-internal.zip | grep -q 'my_little_boat.exe'
          unzip -l build/my-little-boat-windows-internal.zip | grep -q 'my_little_boat.pck'
          unzip -l build/my-little-boat-windows-internal.zip | grep -q 'SHA256SUMS.txt'

      - name: Upload internal Windows package
        uses: actions/upload-artifact@v4
        with:
          name: my-little-boat-windows-internal
          path: build/my-little-boat-windows-internal.zip
          if-no-files-found: error
          retention-days: 30
