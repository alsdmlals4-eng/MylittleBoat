name: Godot 4.7 validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Godot 4.7
        uses: chickensoft-games/setup-godot@v2.4.1
        with:
          version: 4.7.0
          use-dotnet: false
          include-templates: true

      - name: Verify Godot version
        run: godot --version

      - name: Complete Godot import cache hydration
        run: godot --headless --path . --import

      - name: Run focused behavior contracts
        shell: bash
        run: |
          status=0
          timeout 20s godot --headless --path . --script res://tests/test_calm_voyage_state.gd || status=1
          timeout 20s godot --headless --path . --script res://tests/test_fishing_session.gd || status=1
          timeout 20s godot --headless --path . --script res://tests/test_game_scene_contract.gd || status=1
          timeout 20s godot --headless --path . --script res://tests/test_album_memory_contract.gd || status=1
          timeout 20s godot --headless --path . --script res://tests/test_camera_input_contract.gd || status=1
          timeout 20s godot --headless --path . --script res://tests/test_resting_core_contract.gd || status=1
          timeout 20s godot --headless --path . --script res://tests/test_boat_decor_persistence.gd || status=1
          timeout 20s godot --headless --path . --script res://tests/test_diorama_avatar_camera_contract.gd || status=1
          timeout 20s godot --headless --path . --script res://tests/test_boat_decoration_contract.gd || status=1
          timeout 20s godot --headless --path . --script res://tests/test_low_pressure_interaction_contract.gd || status=1
          timeout 20s godot --headless --path . --script res://tests/test_boat_life_scene_contract.gd || status=1
          timeout 20s godot --headless --path . --script res://tests/test_boat_life_ui_contract.gd || status=1
          timeout 20s godot --headless --path . --script res://tests/test_runtime_image_asset_contract.gd || status=1
          timeout 20s godot --headless --path . --script res://tests/test_handpainted_visual_slice_contract.gd || status=1
          timeout 20s godot --headless --path . --script res://tests/test_cosmetic_identity_profile.gd || status=1
          timeout 20s godot --headless --path . --script res://tests/test_identity_visual_contract.gd || status=1
          timeout 20s godot --headless --path . --script res://tests/test_main_menu_identity_contract.gd || status=1
          timeout 20s godot --headless --path . --script res://tests/test_storybook_art_card_contract.gd || status=1
          timeout 20s godot --headless --path . --script res://tests/test_time_of_day_contract.gd || status=1
          timeout 20s godot --headless --path . --script res://tests/test_main_menu_time_of_day_contract.gd || status=1
          timeout 20s godot --headless --path . --script res://tests/test_game_scene_time_of_day_contract.gd || status=1
          timeout 20s godot --headless --path . --script res://tests/test_runtime_capture_guard_contract.gd || status=1
          timeout 20s godot --headless --path . --script res://tests/test_final_composite_decor_contract.gd || status=1
          timeout 20s godot --headless --path . --script res://tests/test_windows_export_contract.gd || status=1
          timeout 20s godot --headless --path . --script res://tests/test_main_menu_atmosphere_background_contract.gd || status=1
          timeout 20s godot --headless --path . --script res://tests/test_album_composition_contract.gd || status=1
          exit "$status"

      - name: Smoke main menu scene
        run: godot --headless --path . --scene "res://scenes/main_menu.tscn" --quit-after 1

      - name: Smoke game scene
        run: godot --headless --path . --scene "res://scenes/game.tscn" --quit-after 1

      - name: Smoke album scene
        run: godot --headless --path . --scene "res://scenes/album.tscn" --quit-after 1

      - name: Export internal Windows package
        shell: bash
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Windows Desktop" build/my_little_boat.exe
          test -f build/my_little_boat.exe
          test -f build/my_little_boat.pck
          sha256sum build/my_little_boat.exe build/my_little_boat.pck > build/SHA256SUMS.txt
          zip -j build/my-little-boat-windows-internal.zip build/my_little_boat.exe build/my_little_boat.pck build/SHA256SUMS.txt
          unzip -l build/my-little-boat-windows-internal.zip | grep -q 'my_little_boat.exe'
          unzip -l build/my-little-boat-windows-internal.zip | grep -q 'my_little_boat.pck'
          unzip -l build/my-little-boat-windows-internal.zip | grep -q 'SHA256SUMS.txt'

      - name: Upload internal Windows package
        uses: actions/upload-artifact@v4
        with:
          name: my-little-boat-windows-internal
          path: build/my-little-boat-windows-internal.zip
          if-no-files-found: error
          retention-days: 30
